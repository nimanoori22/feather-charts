[package]
name = "feather-charts"
version = "0.1.0"
edition = "2024"

[dependencies]
csscolorparser = "0.8.3"
chrono = { version = "0.4", features = ["unstable-locales"] }
iced = { version = "0.14.0", features = ["canvas", "advanced"] }

[dev-dependencies]
# Verify the actual software renderer damage work, already locked transitively.
iced_tiny_skia = "0.14.1"
# Example-only timer subscriptions for hands-free interaction acceptance.
iced = { version = "0.14.0", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = "0.30"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
libc = "0.2"
