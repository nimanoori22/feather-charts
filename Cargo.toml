[package]
name = "feather-charts"
version = "0.1.0"
edition = "2024"
description = "Native financial charts for Iced, ported from TradingView Lightweight Charts"
license = "Apache-2.0"
repository = "https://github.com/nimanoori22/feather-charts"
documentation = "https://docs.rs/feather-charts"
readme = "README.md"
keywords = ["charts", "financial", "iced", "candlestick", "trading"]
categories = ["gui", "visualization"]

[dependencies]
csscolorparser = "0.8.3"
chrono = { version = "0.4", features = ["unstable-locales"] }
iced = { version = "0.14.0", features = ["canvas", "advanced", "image-without-codecs"] }

[dev-dependencies]
# Verify the actual software renderer damage work, already locked transitively.
iced_tiny_skia = "0.14.1"
# Example-only timer subscriptions for hands-free interaction acceptance.
iced = { version = "0.14.0", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = "0.30"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
libc = "0.2"

# Dense software rasterization is too slow without dependency optimization.
[profile.dev.package.tiny-skia]
opt-level = 3
# Its 16-lane pixel arithmetic needs release-style overflow semantics to vectorize.
overflow-checks = false

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.iced_tiny_skia]
opt-level = 3

[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia-0.14.1" }
iced_wgpu = { path = "vendor/iced_wgpu-0.14.0" }
